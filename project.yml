name: PocketAgent
options:
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    MARKETING_VERSION: '0.3.6'
    CURRENT_PROJECT_VERSION: '9'
    CODE_SIGNING_ALLOWED: NO
    SWIFT_INCLUDE_PATHS: '$(SRCROOT)/Native'
    OTHER_SWIFT_FLAGS: '$(inherited) -file-prefix-map $(SRCROOT)=.'
    HEADER_SEARCH_PATHS: '$(SRCROOT)/Native'
    OTHER_LDFLAGS: '$(inherited) $(SRCROOT)/.build/native/libidevice_ffi.a'
    POCKETAGENT_RUNNER_BUNDLE_ID: io.github.borealin.PocketAgent.WDA.xctrunner
packages:
  AgentKit:
    url: https://github.com/Borealin/AgentKit.git
    revision: e382e5e5c4412e997ba42daa1230930800f88c44
targets:
  PocketAgent:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources/RustLicenses, Resources/SwiftLicenses, Resources/iSHLicenses]
      - path: App/Resources/RustLicenses
        type: folder
      - path: App/Resources/SwiftLicenses
        type: folder
      - path: App/Resources/iSHLicenses
        type: folder
      - path: .build/ish/ish-root.tar.gz
        buildPhase: resources
      - path: Native/ish/PocketISH.m
        compilerFlags: '-I$(SRCROOT)/.build/ish/sources/ish -I$(SRCROOT)/.build/ish/sources/ish/app'
    dependencies:
      - package: AgentKit
        product: AgentKit
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: BackgroundTasks.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.borealin.PocketAgent
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The iSH kernel libraries need their sections aligned and every
        # initcall object loaded (Scripts/ish_runtime.py builds them).
        ISH_PRODUCTS: '$(SRCROOT)/.build/ish/Release-iphoneos'
        OTHER_LDFLAGS: >-
          $(inherited) -Wl,-sectalign,__DATA,__percpu_first,1000 -Wl,-sectalign,__DATA,__tracepoints,20
          -force_load $(ISH_PRODUCTS)/liblinux.a -force_load $(ISH_PRODUCTS)/libiSHLinux.a
          $(ISH_PRODUCTS)/libiSHLinuxUser.a $(ISH_PRODUCTS)/libfakefs.a $(ISH_PRODUCTS)/libish_emu.a
          $(ISH_PRODUCTS)/libarchive.a $(ISH_PRODUCTS)/libiSHHost.a -lsqlite3 -lz -liconv
    info:
      path: .build/Info.plist
      properties:
        CFBundleDisplayName: PocketAgent
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers:
          - '$(PRODUCT_BUNDLE_IDENTIFIER).run.*'
        NSCameraUsageDescription: 拍摄照片并作为图片附加到你发送给助手的消息中。
        NSLocalNetworkUsageDescription: 通过本机 VPN 连接这台 iPhone 的开发服务，执行你在对话中请求的手机操作。
        NSBonjourServices: [_pocketagent._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        PocketAgentRunnerBundleID: '$(POCKETAGENT_RUNNER_BUNDLE_ID)'
schemes:
  PocketAgent:
    build:
      targets:
        PocketAgent: all
    run:
      config: Debug
    archive:
      config: Release
